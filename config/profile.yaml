projects:
  - name: "NNUI-KIT (Universal Light-DOM Component System)"
    url: "https://nnuikit.com/"
    stack: "Universal Light-DOM Components, TypeScript, CSS Variables, W3C DTCG Tokens, ElementInternals, BroadcastChannel, React 19/18, Svelte 5, Vue 3, HTMX 2, CLI"
    highlights:
      - "Architected NNUI-KIT (v1.0.5): An open-source, platform-native Light-DOM component architecture featuring 45 accessible components and primitives living 100% in the Light DOM without Shadow DOM traps or virtual DOM overhead."
      - "Sub-40 KB Complete Suite: Engineered all 45 components + virtualized data grid + calendar to bundle into only 38.9 kB gzipped JavaScript — 5x lighter than MUI, Mantine, or Radix + AG Grid."
      - "Native Form Participation: Solved web component form serialization natively using ElementInternals, allowing seamless form submission and global Tailwind/CSS cascade without Shadow DOM styling boundaries."
      - "Declarative State & URL Sync: Built persist='url' and persist='local' primitives for automatic URL query sync and draft auto-saving without routing boilerplate."
      - "Cross-Tab Broadcast Sync: Implemented sync='cross-tab' leveraging the native browser BroadcastChannel API for multi-tab synchronization with zero server or WebSocket overhead."
      - "AI Introspection Protocol: Created element.inspectAI() protocol and llms.txt standard, returning machine-readable JSON schemas and state models tailored for autonomous AI coding agents (Claude, Cursor, Copilot)."
      - "Multi-Framework Adapters: Authored first-class adapters for React 18 & 19 (Next.js 15 App Router), Svelte 5 (Runes), Vue 3 & Nuxt 3 (Composition API), Astro, and HTMX 2."
